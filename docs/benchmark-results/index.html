<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="UMR benchmark evaluation results on LIBERO and RLBench.">
  <title>UMR Benchmark Results</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20232a;
      --muted: #69707d;
      --line: #e3e6eb;
      --panel: #f7f8fa;
      --accent: #6b52c7;
      --success: #1f7a55;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0 72px; }
    .back { color: var(--accent); text-decoration: none; font-weight: 650; }
    h1 { margin: 18px 0 8px; font-size: clamp(2rem, 5vw, 3.3rem); letter-spacing: -0.045em; }
    .lead { max-width: 720px; margin: 0; color: var(--muted); font-size: 1.05rem; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 36px; }
    .card { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 14px 38px rgba(31, 38, 51, .06); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .card h2 { margin: 0 0 4px; font-size: 1.45rem; }
    .status { margin: 0; color: var(--muted); font-size: .9rem; }
    .score { text-align: right; white-space: nowrap; }
    .score strong { display: block; color: var(--success); font-size: 2rem; line-height: 1; }
    .score span { color: var(--muted); font-size: .8rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-size: .76rem; letter-spacing: .04em; text-transform: uppercase; }
    tbody tr:last-child td { border-bottom: 0; }
    .name { font-weight: 620; }
    .raw { display: inline-block; margin: 18px 20px 20px; color: var(--accent); font-weight: 650; text-decoration: none; }
    .error { padding: 24px; color: #a33; }
    @media (max-width: 780px) {
      main { padding-top: 32px; }
      .grid { grid-template-columns: 1fr; }
      .card-head { padding: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">&larr; Back to UMR</a>
    <h1>Benchmark Results</h1>
    <p class="lead">Evaluation summaries for UMR on the LIBERO and RLBench manipulation benchmarks.</p>
    <div class="grid" id="results" aria-live="polite"></div>
  </main>
  <script>
    const benchmarks = [
      { title: 'LIBERO', path: 'libero/progress.json', collection: 'suites' },
      { title: 'RLBench', path: 'rlbench/progress.json', collection: 'tasks' }
    ];

    const percent = value => `${(Number(value || 0) * 100).toFixed(1)}%`;
    const label = value => String(value).replaceAll('_', ' ').replace(/\b\w/g, char => char.toUpperCase());

    async function renderBenchmark(benchmark) {
      const card = document.createElement('article');
      card.className = 'card';
      try {
        const response = await fetch(benchmark.path, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const rows = Object.values(data[benchmark.collection] || {});
        card.innerHTML = `
          <header class="card-head">
            <div><h2>${benchmark.title}</h2><p class="status">${data.completed_episode_count} / ${data.expected_episode_count} episodes completed</p></div>
            <div class="score"><strong>${percent(data.success_rate)}</strong><span>success rate</span></div>
          </header>
          <div class="table-wrap"><table>
            <thead><tr><th>Task / Suite</th><th>Success</th><th>Trials</th><th>Rate</th></tr></thead>
            <tbody>${rows.map(row => `<tr><td class="name">${label(row.task || row.suite)}</td><td>${row.success_count}</td><td>${row.completed_episode_count}</td><td>${percent(row.success_rate)}</td></tr>`).join('')}</tbody>
          </table></div>
          <a class="raw" href="${benchmark.path}" target="_blank" rel="noopener noreferrer">View progress.json &rarr;</a>`;
      } catch (error) {
        card.innerHTML = `<header class="card-head"><div><h2>${benchmark.title}</h2></div></header><p class="error">Results could not be loaded.</p>`;
      }
      return card;
    }

    Promise.all(benchmarks.map(renderBenchmark)).then(cards => {
      document.getElementById('results').append(...cards);
    });
  </script>
</body>
</html>
